<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="/docs/node_modules/@bugsnag/browserlite/dist/bugsnag.min.js"></script>
    <script type="text/javascript">
      var NOTIFY = decodeURIComponent(window.location.search.match(/NOTIFY=([^&]+)/)[1])
      var SESSIONS = decodeURIComponent(window.location.search.match(/SESSIONS=([^&]+)/)[1])
      var API_KEY = decodeURIComponent(window.location.search.match(/API_KEY=([^&]+)/)[1])

      // a minimal custom plugin, opted into via the `plugins` config option,
      // demonstrating that additional functionality can be added on demand
      var manualBreadcrumbPlugin = {
        name: 'manual-breadcrumb-plugin',
        load: function (client) {
          client.leaveBreadcrumb('manual breadcrumb')
        }
      }

      Bugsnag.start({
        apiKey: API_KEY,
        endpoints: { notify: NOTIFY, sessions: SESSIONS },
        plugins: [manualBreadcrumbPlugin]
      })
    </script>
  </head>
  <body>
    <script>
      Bugsnag.notify(new Error('bad things'))
    </script>
  </body>
</html>
